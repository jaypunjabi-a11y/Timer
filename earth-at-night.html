<title>Earth at Night</title>
<meta name="description" content="An interactive night-side globe with real city lights, borders, stars and today's Moon phase.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL night sky; quiet corner annotations like an observatory log. Single dark look by design. */
:root{
  --sky:#03050b;
  --ink:#ece6d8;
  --muted:#8c93a6;
  --sodium:#ffb25c;
  --rule:rgba(236,230,216,.14);
  --panel:rgba(6,9,18,.72);
  --display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--sky);color:var(--ink);overflow:hidden}
body{font-family:var(--mono);font-size:12px;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage.hot{cursor:pointer}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.tl{top:calc(env(safe-area-inset-top,0px) + 18px);left:18px;max-width:calc(100% - 36px)}
.bl{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:18px;right:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1;margin:0;letter-spacing:.005em;text-wrap:balance}
h1 em{color:var(--sodium);font-style:italic}
.sub{color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
.row{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:flex-end;justify-content:space-between}
.moon{display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.moon b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);letter-spacing:.01em}
.moon span{color:var(--muted)}
.hint{color:var(--muted);letter-spacing:.06em}
.hint kbd{font-family:inherit;color:var(--ink)}
#tip{position:fixed;left:0;top:0;pointer-events:none;transform:translate(-50%,calc(-100% - 16px));
  background:var(--panel);border:1px solid var(--rule);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:8px 11px 7px;border-radius:3px;white-space:nowrap;display:flex;flex-direction:column;gap:2px}
#tip .n{font-family:var(--display);font-size:20px;line-height:1.05;color:var(--ink)}
#tip .c{color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#tip::after{content:"";position:absolute;left:50%;bottom:-11px;width:1px;height:10px;background:var(--sodium);opacity:.8}
#ring{position:fixed;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border:1px solid var(--sodium);border-radius:50%;pointer-events:none;box-shadow:0 0 10px rgba(255,178,92,.45)}
.modes{pointer-events:auto;display:inline-flex;margin-top:6px;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--panel);width:max-content}
.modes button{font:inherit;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--sky)}
.modes button:focus-visible{outline:1px solid var(--sodium);outline-offset:2px}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.cl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:var(--display);font-size:15px;letter-spacing:.04em;color:var(--ink);
  text-shadow:0 0 4px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.7);white-space:nowrap;transition:opacity .25s}
.cl.home{font-size:22px;font-style:italic;color:#ffd6a0}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:520px){.hint .long{display:none}.moon b{font-size:19px}}
</style>

<div id="stage" aria-label="Interactive globe of Earth at night" role="application"></div>
<div class="hud tl">
  <h1>Earth <span id="h1pre">by</span> <em id="h1mode">Day</em></h1>
  <div class="sub" id="when"></div>
  <div class="modes" role="group" aria-label="Lighting">
    <button type="button" id="btnDay" aria-pressed="true">Day</button><button type="button" id="btnNight" aria-pressed="false">Night</button>
  </div>
</div>
<div class="hud bl">
  <div class="row">
    <div class="moon" id="moon"></div>
    <div class="hint"><span class="long"><kbd>Drag</kbd> to turn · <kbd>Scroll</kbd> or <kbd>pinch</kbd> to zoom · </span><kbd>Tap</kbd> a city for its name</div>
  </div>
</div>
<div id="tip" hidden><div class="n"></div><div class="c"></div></div>
<div id="ring" hidden></div>
<div id="labels" aria-hidden="true"></div>
<div id="err" hidden>This globe needs WebGL, which isn't available in this browser.</div>

let dist=3.2,targetDist=3.2,minDist=1.22,maxDist=6;
let lastInteract=performance.now();
function fitDist(){const vf=camera.fov*D2R/2;const hf=Math.atan(Math.tan(vf)*camera.aspect);const f=Math.min(vf,hf);return 1.18/Math.sin(f);}
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  const fd=fitDist();maxDist=fd*1.9;if(!resize.done){targetDist=dist=1+(fd-1)*(w<520?0.5:0.62);resize.done=true;}targetDist=Math.min(targetDist,maxDist);
  // park the moon in the upper right of the view
  const z=40, hh=Math.tan(camera.fov*D2R/2)*z, hw=hh*camera.aspect;
  const r=Math.min(hw,hh)*0.085;
  moon.scale.setScalar(r);moon.position.set(hw-r*(w<520?1.9:3.2),hh-r*(w<520?3.6:3.0),-z);
}
addEventListener('resize',resize);resize();

const pointers=new Map();let pinch0=0,pinchDist0=0,down=null;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  lastInteract=performance.now();vYaw=vPitch=0;
  if(pointers.size===1){down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};stage.classList.add('dragging');}
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);pinchDist0=targetDist;if(down)down.moved=true;}
});
el.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)){if(e.pointerType==='mouse')stage.classList.toggle('hot',pickCity(e.clientX,e.clientY)>=0);return;}
  const p=pointers.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  lastInteract=performance.now();
  if(pointers.size===1){
    if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)down.moved=true;
    const k=(dist-1)/innerHeight*1.9;yaw+=dx*k;pitch+=dy*k;pitch=Math.max(-1.45,Math.min(1.45,pitch));
    vYaw=dx*k;vPitch=dy*k;
  }else if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0>0)targetDist=Math.max(minDist,Math.min(maxDist,1+(pinchDist0-1)*pinch0/d));}
});
function up(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);
  if(pointers.size===0){stage.classList.remove('dragging');
    if(down&&!down.moved&&performance.now()-down.t<600)tap(e.clientX,e.clientY,e.pointerType);down=null;}
  if(pointers.size<2)pinch0=0;}
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();lastInteract=performance.now();
  targetDist=Math.max(minDist,Math.min(maxDist,1+(targetDist-1)*Math.exp(e.deltaY*0.0015)));},{passive:false});

// ---------- Day / Night ----------
let dayT=1,dayTarget=1;
const bDay=document.getElementById('btnDay'),bNight=document.getElementById('btnNight');
function setMode(day){dayTarget=day?1:0;bDay.setAttribute('aria-pressed',day);bNight.setAttribute('aria-pressed',!day);
  document.getElementById('h1pre').textContent=day?'by':'at';document.getElementById('h1mode').textContent=day?'Day':'Night';
  if(reduceMotion)dayT=dayTarget;}
bDay.addEventListener('click',()=>setMode(true));bNight.addEventListener('click',()=>setMode(false));
const cNight=new THREE.Color(0xd8e4f2),cDay=new THREE.Color(0x0b1e33),bNightC=new THREE.Color(0xb7c3d6),bDayC=new THREE.Color(0xfff6e0);
function applyMode(k){earth.material.uniforms.uDay.value=k;cityMat.uniforms.uDay.value=k;atmo.material.uniforms.uDay.value=k;
  coast.material.color.copy(cNight).lerp(cDay,k);coast.material.opacity=0.62-0.27*k;
  borders.material.color.copy(bNightC).lerp(bDayC,k);borders.material.opacity=0.20+0.38*k;
  stars.children[0].material.opacity=1-0.45*k;}
stars.children[0].material.transparent=true;

// ---------- Country labels: India and its neighbours ----------
const LABELS=[["India",22.5,79,1],["Pakistan",29.5,69],["Nepal",28.3,84],["Bhutan",27.4,90.4],["Bangladesh",23.8,90.2],["Sri Lanka",7.7,80.7],
  ["Maldives",3.2,73.2],["Afghanistan",33.8,66],["China",33,101],["Myanmar",21.5,96],["Iran",32.5,54]]
  .map(([n,la,lo,home])=>{const d=document.createElement('div');d.className='cl'+(home?' home':'');d.textContent=n;
    document.getElementById('labels').appendChild(d);return {el:d,local:ll2v(la,lo,1.0)};});
const lp={x:0,y:0},nrm=new THREE.Vector3();
function updateLabels(){
  const near=dist<fitDist()*0.85; // only once zoomed in toward the region
  const placed=[];
  for(const L of LABELS){
    nrm.copy(L.local).applyQuaternion(globe.quaternion);
    const facing=nrm.dot(camPos.copy(camera.position).normalize());
    let vis=near&&screenOf(L.local,lp)&&facing>0.45;
    const hw=L.el.offsetWidth/2+6;
    if(vis&&placed.some(q=>Math.abs(q.x-lp.x)<q.hw+hw&&Math.abs(q.y-lp.y)<20))vis=false;
    if(vis)placed.push({x:lp.x,y:lp.y,hw});
    L.el.style.opacity=vis?Math.min(1,(facing-0.45)*5):0;
    if(vis)L.el.style.transform=`translate(${lp.x}px,${lp.y}px) translate(-50%,-50%)`;}
}

// ---------- Picking ----------
const tmp=new THREE.Vector3(),camPos=new THREE.Vector3();
function screenOf(local,out){tmp.copy(local).applyMatrix4(globe.matrixWorld);
  const facing=tmp.dot(camPos.copy(camera.position).sub(tmp))>0; // normal·(eye - p)
  tmp.project(camera);out.x=(tmp.x+1)/2*innerWidth;out.y=(1-tmp.y)/2*innerHeight;return facing;}
const sp={x:0,y:0};
function pickCity(x,y,radius=16){let best=-1,bd=radius*radius;
  CITIES.forEach((c,i)=>{if(!screenOf(cityPos[i],sp))return;const d=(sp.x-x)**2+(sp.y-y)**2;
    const bias=c[4]*0.6; if(d-bias<bd){bd=d-bias;best=i;}});return best;}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function globeLatLon(x,y){ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const o=ray.ray.origin,d=ray.ray.direction;const b=o.dot(d),c=o.lengthSq()-1,disc=b*b-c;if(disc<0)return null;
  const p=o.clone().addScaledVector(d,-b-Math.sqrt(disc));p.applyQuaternion(globe.quaternion.clone().invert());
  return {lat:Math.asin(Math.max(-1,Math.min(1,p.y)))/D2R,lon:Math.atan2(-p.z,p.x)/D2R};}

const tip=document.getElementById("tip"),pin=document.getElementById("ring");
let sel=null; // {city:i} or {lat,lon,name}
function popFmt(m){return m>=1?`${m.toFixed(1)} M`:`${Math.round(m*1000)} K`;}
function tap(x,y,type){
  const i=pickCity(x,y,type==='touch'?30:18);
  if(i>=0){const c=CITIES[i];sel={local:cityPos[i]};
    tip.querySelector('.n').textContent=c[0];
    tip.querySelector('.c').textContent=`${c[1]} · metro ≈ ${popFmt(c[4])}`;pin.hidden=false;}
  else{const ll=globeLatLon(x,y);const name=ll&&countryAt(ll.lat,ll.lon);
    if(name){sel={local:ll2v(ll.lat,ll.lon,1.0)};tip.querySelector('.n').textContent=name;
      tip.querySelector('.c').textContent=`${Math.abs(ll.lat).toFixed(1)}°${ll.lat>=0?'N':'S'} ${Math.abs(ll.lon).toFixed(1)}°${ll.lon>=0?'E':'W'}`;pin.hidden=true;}
    else sel=null;}
  tip.hidden=!sel;if(!sel)pin.hidden=true;
}

// ---------- Loop ----------
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05);const t=clock.elapsedTime;
  if(pointers.size===0){yaw+=vYaw;pitch+=vPitch;vYaw*=0.92;vPitch*=0.92;pitch=Math.max(-1.45,Math.min(1.45,pitch));
    if(!reduceMotion&&!sel&&performance.now()-lastInteract>4000)yaw+=dt*0.035;}
  dist+=(targetDist-dist)*Math.min(1,dt*9);
  camera.position.set(0,0,dist);camera.lookAt(0,0,0);
  globe.rotation.set(pitch,yaw,0,'XYZ');stars.rotation.copy(globe.rotation);
  globe.updateMatrixWorld();camera.updateMatrixWorld();
  dayT+=(dayTarget-dayT)*Math.min(1,dt*4);applyMode(dayT);earth.material.uniforms.t.value=t;updateLabels();
  cityMat.uniforms.t.value=t;cityMat.uniforms.zoom.value=Math.min(2.2,Math.pow(fitDist()/dist,0.6))*(innerHeight/900+0.35);
  if(sel){const vis=screenOf(sel.local,sp);tip.hidden=!vis;
    if(vis){tip.style.left=sp.x+'px';tip.style.top=sp.y+'px';pin.style.left=sp.x+'px';pin.style.top=sp.y+'px';}
    if(!vis)pin.hidden=true;else if(sel.local.length()>1.001)pin.hidden=false;}
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

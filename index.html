<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dishika Focus Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6fa5;
    --orange: #ffa552;
    --yellow: #ffd93d;
    --green: #6bcB77;
    --blue: #4d96ff;
    --purple: #a66bff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(-45deg, var(--pink), var(--purple), var(--blue), var(--green), var(--yellow), var(--orange));
    background-size: 400% 400%;
    animation: gradientShift 18s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    padding: 32px 28px 36px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    position: relative;
    border: 6px solid #fff;
  }

  h1 {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(1.7rem, 6vw, 2.4rem);
    margin: 4px 0 2px;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    color: #6b5b95;
    font-weight: 600;
    margin-bottom: 18px;
    font-size: 1rem;
  }

  .mascot {
    font-size: 3rem;
    margin: 4px 0 10px;
    display: inline-block;
    transition: transform 0.3s ease;
  }
  .mascot.spin { animation: bounce 1.2s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-14px) rotate(6deg); }
  }

  .presets {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .preset-btn {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .preset-btn:hover { transform: translateY(-2px); }
  .preset-btn:active { transform: translateY(1px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .preset-btn.active {
    background: linear-gradient(135deg, var(--orange), var(--pink));
    outline: 3px solid #fff;
    outline-offset: 2px;
  }
  .preset-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .ring-wrap {
    position: relative;
    width: min(260px, 70vw);
    height: min(260px, 70vw);
    margin: 0 auto 20px;
  }

  svg { transform: rotate(-90deg); width: 100%; height: 100%; }

  .ring-bg { fill: none; stroke: #f1e9ff; stroke-width: 16; }

  .ring-progress {
    fill: none;
    stroke-width: 16;
    stroke-linecap: round;
    stroke: url(#ringGradient);
    transition: stroke-dashoffset 1s linear;
  }

  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .time {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(2rem, 9vw, 2.8rem);
    color: #4a3f6b;
  }

  .status-label {
    font-weight: 600;
    font-size: 0.85rem;
    color: #9a8fc0;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 6px;
  }

  .ctrl-btn {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 18px;
    padding: 14px 20px;
    min-width: 92px;
    cursor: pointer;
    color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .ctrl-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .ctrl-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .start-btn { background: linear-gradient(135deg, #6bcB77, #38b673); }
  .pause-btn { background: linear-gradient(135deg, #ffd93d, #ffa552); color: #5a4300; box-shadow: 0 5px 0 rgba(0,0,0,0.12); }
  .stop-btn { background: linear-gradient(135deg, #ff6fa5, #ff4b6e); }
  .reset-btn { background: linear-gradient(135deg, #4d96ff, #a66bff); }

  .cheer {
    margin-top: 16px;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 1.1rem;
    color: #ff4b6e;
    min-height: 1.4em;
  }

  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 16px;
    opacity: 0.9;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 999;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(600deg); opacity: 0.3; }
  }

  @media (max-width: 420px) {
    .ctrl-btn { min-width: 74px; padding: 12px 14px; font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="mascot" id="mascot">🚀</div>
  <h1>Dishika's Focus Journey</h1>
  <div class="subtitle">Pick a mission length and blast off into focus time!</div>

  <div class="presets" id="presets">
    <button class="preset-btn active" data-mins="15">15 min</button>
    <button class="preset-btn" data-mins="30">30 min</button>
    <button class="preset-btn" data-mins="45">45 min</button>
    <button class="preset-btn" data-mins="60">60 min</button>
  </div>

  <div class="ring-wrap">
    <svg viewBox="0 0 240 240">
      <defs>
        <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff6fa5"/>
          <stop offset="50%" stop-color="#ffa552"/>
          <stop offset="100%" stop-color="#4d96ff"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="120" cy="120" r="104"></circle>
      <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="104"></circle>
    </svg>
    <div class="time-display">
      <div class="time" id="timeLabel">15:00</div>
      <div class="status-label" id="statusLabel">Ready</div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn start-btn" id="startBtn">▶ Start</button>
    <button class="ctrl-btn pause-btn" id="pauseBtn" disabled>⏸ Pause</button>
    <button class="ctrl-btn stop-btn" id="stopBtn" disabled>⏹ Stop</button>
    <button class="ctrl-btn reset-btn" id="resetBtn">↺ Reset</button>
  </div>

  <div class="cheer" id="cheer"></div>
</div>

<script>
(function () {
  const presetButtons = document.querySelectorAll('.preset-btn');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const resetBtn = document.getElementById('resetBtn');
  const timeLabel = document.getElementById('timeLabel');
  const statusLabel = document.getElementById('statusLabel');
  const mascot = document.getElementById('mascot');
  const cheer = document.getElementById('cheer');
  const ringProgress = document.getElementById('ringProgress');

  const RADIUS = 104;
  const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
  ringProgress.style.strokeDasharray = `${CIRCUMFERENCE}`;
  ringProgress.style.strokeDashoffset = '0';

  const mascots = ['🚀', '🌟', '🦄', '🌈', '🎈'];

  let selectedMinutes = 15;
  let totalSeconds = selectedMinutes * 60;
  let remainingSeconds = totalSeconds;
  let intervalId = null;
  let state = 'idle'; // idle | running | paused | stopped

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateDisplay() {
    timeLabel.textContent = formatTime(remainingSeconds);
    const fraction = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
    ringProgress.style.strokeDashoffset = `${CIRCUMFERENCE * (1 - fraction)}`;
  }

  function setStatus(text) {
    statusLabel.textContent = text;
  }

  function setButtonsForState() {
    presetButtons.forEach(btn => { btn.disabled = state === 'running' || state === 'paused'; });
    startBtn.disabled = state === 'running';
    pauseBtn.disabled = state !== 'running';
    stopBtn.disabled = state === 'idle' || state === 'stopped';
    resetBtn.disabled = false;
  }

  function pickNewMascot() {
    mascot.textContent = mascots[Math.floor(Math.random() * mascots.length)];
  }

  function tick() {
    remainingSeconds--;
    if (remainingSeconds <= 0) {
      remainingSeconds = 0;
      updateDisplay();
      completeJourney();
      return;
    }
    updateDisplay();
  }

  function startTimer() {
    if (state === 'running') return;
    if (state === 'idle' || state === 'stopped') {
      remainingSeconds = totalSeconds;
    }
    state = 'running';
    mascot.classList.add('spin');
    setStatus('Focusing…');
    cheer.textContent = '';
    setButtonsForState();
    updateDisplay();
    clearInterval(intervalId);
    intervalId = setInterval(tick, 1000);
  }

  function pauseTimer() {
    if (state !== 'running') return;
    clearInterval(intervalId);
    state = 'paused';
    mascot.classList.remove('spin');
    setStatus('Paused');
    setButtonsForState();
  }

  function stopTimer() {
    clearInterval(intervalId);
    state = 'stopped';
    remainingSeconds = 0;
    mascot.classList.remove('spin');
    mascot.textContent = '🛑';
    setStatus('Stopped');
    cheer.textContent = '';
    setButtonsForState();
    updateDisplay();
  }

  function resetTimer() {
    clearInterval(intervalId);
    state = 'idle';
    remainingSeconds = totalSeconds;
    mascot.classList.remove('spin');
    mascot.textContent = '🚀';
    setStatus('Ready');
    cheer.textContent = '';
    setButtonsForState();
    updateDisplay();
  }

  function completeJourney() {
    clearInterval(intervalId);
    state = 'stopped';
    mascot.classList.remove('spin');
    mascot.textContent = '🎉';
    setStatus('Journey complete!');
    cheer.textContent = 'Great job Dishika! You finished your focus journey! ✨';
    setButtonsForState();
    launchConfetti();
    playChime();
  }

  function selectPreset(mins, btn) {
    if (state === 'running' || state === 'paused') return;
    selectedMinutes = mins;
    totalSeconds = mins * 60;
    remainingSeconds = totalSeconds;
    presetButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state = 'idle';
    mascot.textContent = '🚀';
    setStatus('Ready');
    cheer.textContent = '';
    setButtonsForState();
    updateDisplay();
  }

  presetButtons.forEach(btn => {
    btn.addEventListener('click', () => selectPreset(parseInt(btn.dataset.mins, 10), btn));
  });

  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', pauseTimer);
  stopBtn.addEventListener('click', stopTimer);
  resetBtn.addEventListener('click', resetTimer);

  function launchConfetti() {
    const colors = ['#ff6fa5', '#ffa552', '#ffd93d', '#6bcB77', '#4d96ff', '#a66bff'];
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 5000);
    }
  }

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.18);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.35);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.18);
        osc.stop(ctx.currentTime + i * 0.18 + 0.4);
      });
    } catch (e) {
      // audio not available; ignore
    }
  }

  setButtonsForState();
  updateDisplay();
})();
</script>

</body>
</html>
